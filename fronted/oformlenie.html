<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetLove</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SweetLove</h1>

    <div class="center">
      <button class="glavnaya">Главная</button>
      <button class="zapivon">Запивон</button>
      <button class="korzina">Корзина</button>
    </div>

    <button class="reegistraciya">Регистрация</button>
  </header>

<main>
    <form class="oformlenie" id="oformlenie" data-section="oformlenie">
          <div id="oformlenie-items"></div>
          <p class="oformlenie-total" id="oformlenie-total">Итого: 0 руб.</p>
          <label for="promo-input">промокод</label>
          <div class="promo-row">
            <input type="text" id="promo-input" maxlength="100" placeholder="Введи промокод">
            <button type="button" class="oformi-btn" id="promo-btn">Применить</button>
          </div>
          <p class="promo-message" id="promo-message"></p>
            <p>способ оплаты:</p>
    <div class="choice">
  <label class="option">
    <input type="radio" name="variant" value="1" checked>
    <span class="square">🍃 листиками</span>
  </label>
  <label class="option">
    <input type="radio" name="variant" value="2">
    <span class="square">💐 цветочками</span>
  </label>
  <label class="option">
    <input type="radio" name="variant" value="3">
    <span class="square">большим спасибо</span>
  </label>
    <label class="option">
    <input type="radio" name="variant" value="4">
    <span class="square">🏦 abdullobank</span>
  </label>
</div>
          
          <button type="submit" class="oformi-btn">Подтвердить заказ</button>
    </form>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
