<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetLove — Запивон</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SweetLove</h1>

    <div class="center">
      <button class="glavnaya">Главная</button>
      <button class="zapivon">Запивон</button>
      <button class="korzina">Корзина</button>
    </div>

    <button class="reegistraciya">Регистрация</button>
  </header>

  <div class="toolbar">
    <div class="sortirovka">
      <p>Сортировка:</p>
      <div class="sortirovka-option">
        <label><input type="radio" name="sort" value="asc"><span class="kvadrat">дешевле</span></label>
        <label><input type="radio" name="sort" value="desc"><span class="kvadrat">дороже</span></label>
      </div>
    </div>

    <div class="filtr">
      <button type="button" class="filtr-btn" id="filtr-btn">Фильтры ▾</button>
      <div class="filtr-menu" id="filtr-menu">
        <label class="filtr-item"><input type="checkbox" value="Чёрный чай"><span>Чёрный чай</span></label>
        <label class="filtr-item"><input type="checkbox" value="Зелёный чай"><span>Зелёный чай</span></label>
        <label class="filtr-item"><input type="checkbox" value="Wellbeing collection"><span>Wellbeing collection</span></label>
      </div>
    </div>
  </div>

  <main class="catalog" id="catalog" data-section="zapivon"></main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
