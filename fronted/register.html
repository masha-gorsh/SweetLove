<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SweetLove — Регистрация</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SweetLove</h1>

    <div class="center">
      <button class="glavnaya">Главная</button>
      <button class="zapivon">Запивон</button>
      <button class="korzina">Корзина</button>
    </div>

    <button class="reegistraciya">Регистрация</button>
  </header>

  <main>
    <form class="register-form" id="register-form">
      <h2>Регистрация</h2>

      <label>Имя
        <input type="text" id="reg-name" maxlength="100" required>
      </label>

      <label>Почта
        <input type="email" id="reg-email" maxlength="255" required>
      </label>

      <label>Пароль
        <input type="password" id="reg-password" minlength="6" maxlength="128" required>
      </label>

      <p class="form-error" id="register-error"></p>

      <button type="submit" class="register-btn">Зарегистрироваться</button>

      <a class="login-link" href="/login">Уже есть аккаунт? Войти</a>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
